<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <title>Document</title>
</head>
<body>
   <header>
    <h1>Clothing Store</h1>
    <div class="cart">
      🛒 Корзина: <span id="cart-count">0</span> товаров | 
      <span id="cart-total">0₸</span>
    </div>
  </header>

  <!-- Каталог товаров -->
  <main class="products">
    <div class="product">
      <img src="https://avatars.mds.yandex.net/i?id=91f2c2d062da3a1b59cefc6fec7e130e_l-5332718-images-thumbs&n=13" alt="Футболка">
      <h2>Футболка</h2>
      <p class="price">3500₸</p>
      <button onclick="addToCart('Футболка', 3500)">В корзину</button>
    </div>

    <div class="product">
      <img src="https://image.hm.com/assets/hm/84/44/84441bdedd6893e6f29ecd2141f5dd3c92a0bf7f.jpg?imwidth=2160" alt="Джинсы">
      <h2>Джинсы</h2>
      <p class="price">7500₸</p>
      <button onclick="addToCart('Джинсы', 7500)">В корзину</button>
    </div>

    <div class="product">
      <img src="https://goods-photos.static1-sima-land.com/items/5901515/0/1600.jpg?v=1615912705" alt="Куртка">
      <h2>Куртка</h2>
      <p class="price">15000₸</p>
      <button onclick="addToCart('Куртка', 15000)">В корзину</button>
    </div>
  </main>


  <section class="cart-items">
    <h2>Корзина</h2>
    <ul id="cart-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
