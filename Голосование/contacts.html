<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Системы Голосования</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>

<div class="container">
    <!-- Общее меню навигации -->
    <nav class="main-nav">
        <a href="./index.html" class="nav-link">О проекте</a>
        <a href="./voting.html" class="nav-link">Голосование</a>
        <a href="./contacts.html" class="nav-link active">Контакты</a>
    </nav>

    <header>
        <h1>Свяжитесь с нами</h1>
        <p class="subtitle">Есть вопросы по интеграции системы в ваш университет?</p>
    </header>

    <main>
        <form class="contact-form" onsubmit="event.preventDefault(); alert('Сообщение отправлено!');">
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" required placeholder="Иван Иванов">
            </div>
            
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" required placeholder="example@uni.edu">
            </div>

            <div class="form-group">
                <label for="message">Сообщение или название вашего ВУЗа</label>
                <textarea id="message" rows="5" required placeholder="Хотим внедрить такую систему в ALT University..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Отправить заявку</button>
        </form>
    </main>
</div>

</body>
</html>
